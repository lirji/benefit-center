name: benefit-center-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Preserve test evidence including isolated MySQL locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/target/surefire-reports/**'
          retention-days: 14
      - name: Validate API contracts
        run: ruby -e "require 'yaml'; YAML.load_file('benefit-contract/src/main/resources/openapi/benefit-center-v1.yaml'); YAML.load_file('benefit-contract/src/main/resources/asyncapi/benefit-center-v1.yaml')"
      - name: Build non-root image
        run: docker build -f deploy/Dockerfile -t benefit-center:${{ github.sha }} .
      - name: Validate observability Compose overlay
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/compose.observability.yml config -q
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benefit-console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: benefit-console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
