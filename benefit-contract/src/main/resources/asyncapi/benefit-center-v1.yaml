asyncapi: 2.6.0
info:
  title: Enterprise Benefit Center Events
  version: 1.1.0
  description: |
    Kafka contracts are at-least-once. Producers use transactional outbox and consumers deduplicate by
    (tenantId, consumerGroup, eventId). Unknown major schema versions must be rejected or sent to a DLQ.
defaultContentType: application/json
channels:
  benefit.award-intent.v1:
    description: Asynchronous equivalent of POST /openapi/v1/award-orders.
    subscribe:
      operationId: consumeAwardIntent
      message: { $ref: '#/components/messages/AwardIntentEnvelope' }
  benefit.fulfillment-event.v1:
    description: Expected, internal-ledger, provider, and wallet-state facts used by queries and reconciliation.
    publish:
      operationId: publishFulfillmentFact
      message: { $ref: '#/components/messages/FulfillmentEnvelope' }
  benefit.remediation.command.v1:
    description: Approved remediation commands from recon-platform.
    subscribe:
      operationId: consumeRemediationCommand
      message: { $ref: '#/components/messages/RemediationCommandEnvelope' }
  benefit.remediation.result.v1:
    description: Monotonic remediation outcomes returned to recon-platform.
    publish:
      operationId: publishRemediationResult
      message: { $ref: '#/components/messages/RemediationResultEnvelope' }
  benefit.sku-template.v1:
    description: Immutable SKU template generations for cache invalidation and downstream read projections.
    publish:
      operationId: publishSkuTemplateChanged
      message: { $ref: '#/components/messages/SkuTemplateChangedEnvelope' }
  workflow.command.start.v1:
    description: Starts benefitSkuGoLive after the local SKU transaction commits.
    publish:
      operationId: publishSkuGoLiveStart
      message: { $ref: '#/components/messages/WorkflowStartEnvelope' }
  workflow.action.requested.v1:
    description: Requests benefit-center to apply a SKU go-live approval decision.
    subscribe:
      operationId: consumeSkuGoLiveAction
      message: { $ref: '#/components/messages/WorkflowActionRequestedEnvelope' }
  workflow.action.applied.v1:
    description: Acknowledges the durable benefit-center outcome so workflow can continue.
    publish:
      operationId: publishSkuGoLiveApplied
      message: { $ref: '#/components/messages/WorkflowActionAppliedEnvelope' }
components:
  messages:
    AwardIntentEnvelope:
      name: AwardIntentEnvelope
      messageId: AwardIntent
      correlationId: { location: '$message.payload#/traceId' }
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: AWARD_INTENT }
              payload: { $ref: '#/components/schemas/AwardIntent' }
    FulfillmentEnvelope:
      name: FulfillmentEnvelope
      messageId: FulfillmentEvent
      correlationId: { location: '$message.payload#/traceId' }
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType:
                enum: [FULFILLMENT_EXPECTED, FULFILLMENT_INTERNAL, FULFILLMENT_PROVIDER, FULFILLMENT_WALLET]
              payload:
                oneOf:
                  - $ref: '#/components/schemas/FulfillmentEvent'
                  - $ref: '#/components/schemas/WalletFulfillmentEvent'
    RemediationCommandEnvelope:
      name: RemediationCommandEnvelope
      messageId: RemediationCommand
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: REMEDIATION_COMMAND }
              payload: { $ref: '#/components/schemas/RemediationCommand' }
    RemediationResultEnvelope:
      name: RemediationResultEnvelope
      messageId: RemediationResult
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { enum: [REMEDIATION_DISPATCHED, REMEDIATION_RESULT] }
              payload: { $ref: '#/components/schemas/RemediationResult' }
    SkuTemplateChangedEnvelope:
      name: SkuTemplateChangedEnvelope
      messageId: SkuTemplateChanged
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              eventType: { const: SKU_TEMPLATE_CHANGED }
              payload: { $ref: '#/components/schemas/SkuTemplateChanged' }
    WorkflowStartEnvelope:
      name: WorkflowStartEnvelope
      messageId: WorkflowStart
      correlationId: { location: '$message.payload#/correlationId' }
      payload:
        allOf:
          - $ref: '#/components/schemas/WorkflowEnvelope'
          - type: object
            properties:
              eventType: { const: workflow.command.start.v1 }
              payload: { $ref: '#/components/schemas/StartProcessCommandV1' }
    WorkflowActionRequestedEnvelope:
      name: WorkflowActionRequestedEnvelope
      messageId: WorkflowActionRequested
      correlationId: { location: '$message.payload#/correlationId' }
      payload:
        allOf:
          - $ref: '#/components/schemas/WorkflowEnvelope'
          - type: object
            properties:
              eventType: { const: workflow.action.requested.v1 }
              payload: { $ref: '#/components/schemas/WorkflowActionRequestedV1' }
    WorkflowActionAppliedEnvelope:
      name: WorkflowActionAppliedEnvelope
      messageId: WorkflowActionApplied
      correlationId: { location: '$message.payload#/correlationId' }
      payload:
        allOf:
          - $ref: '#/components/schemas/WorkflowEnvelope'
          - type: object
            properties:
              eventType: { const: workflow.action.applied.v1 }
              payload: { $ref: '#/components/schemas/WorkflowActionAppliedV1' }
  schemas:
    Envelope:
      type: object
      additionalProperties: false
      required: [eventId, eventType, schemaVersion, tenantId, occurredAt, partitionKey, payload]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 128 }
        eventType: { type: string, minLength: 1, maxLength: 64 }
        schemaVersion: { type: string, pattern: '^1(\\.[0-9]+)?$' }
        tenantId: { type: string, minLength: 1, maxLength: 64 }
        occurredAt: { type: string, format: date-time }
        traceId: { type: string, maxLength: 128 }
        partitionKey: { type: string, minLength: 1, maxLength: 256 }
        payload: { type: object }
    AwardIntent:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceSystem, sourceRequestId, recipientRef, partialPolicy, items]
      properties:
        schemaVersion: { const: '1.0' }
        sourceSystem: { type: string, maxLength: 64 }
        sourceRequestId: { type: string, maxLength: 128 }
        sourceBusinessNo: { type: string, maxLength: 128 }
        recipientRef: { type: string, maxLength: 256 }
        partialPolicy: { const: BEST_EFFORT }
        decision:
          type: object
          properties:
            decisionId: { type: string }
            activityId: { type: string }
            activityVersion: { type: integer, minimum: 1 }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/AwardItemIntent' }
        trace:
          type: object
          additionalProperties: { type: string }
    AwardItemIntent:
      type: object
      additionalProperties: false
      required: [clientItemId, benefitSkuId, benefitType, quantity]
      properties:
        clientItemId: { type: string, maxLength: 128 }
        benefitSkuId: { type: string, maxLength: 128 }
        benefitType: { $ref: '#/components/schemas/BenefitType' }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        quantity: { type: integer, minimum: 1, maximum: 1 }
        metadata: { type: object, additionalProperties: { type: string } }
      description: Atomic item (quantity=1); split multiple units into stable clientItemIds. CASH requires money; non-cash items must omit amountMinor and currency.
    FulfillmentEvent:
      type: object
      additionalProperties: false
      required: [awardOrderNo, awardItemNo, clientItemId, sourceSystem, sourceRequestId, status, occurredAt, factType, skuId, benefitType, quantity, entryType]
      properties:
        awardOrderNo: { type: string }
        awardItemNo: { type: string }
        clientItemId: { type: string, description: 上游稳定项 ID，用于与营销应发事实勾稽 }
        sourceSystem: { type: string }
        sourceRequestId: { type: string, description: 跨系统幂等请求号 }
        operationNo: { type: string }
        status: { type: string }
        channelCode: { type: string }
        providerReference: { type: string }
        errorCode: { type: string }
        occurredAt: { type: string, format: date-time }
        factType: { enum: [EXPECTED, INTERNAL, PROVIDER] }
        skuId: { type: string }
        benefitType: { $ref: '#/components/schemas/BenefitType' }
        quantity: { type: integer, minimum: 1 }
        amountMinor: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        entryType: { enum: [ISSUE, REVERSAL, FREEZE, REDEEM, REFUND] }
      description: Non-cash fulfillment facts omit amountMinor/currency; reconciliation uses quantity and status.
    WalletFulfillmentEvent:
      type: object
      additionalProperties: false
      required: [walletEntryId, skuId, skuVersion, status, entryType, operationNo, occurredAt]
      properties:
        walletEntryId: { type: string, maxLength: 64 }
        skuId: { type: string, maxLength: 128 }
        skuVersion: { type: integer, format: int64, minimum: 0 }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { enum: [FROZEN, USED, REVERSED] }
        entryType: { enum: [FREEZE, REDEEM, REFUND] }
        operationNo: { type: string, maxLength: 64 }
        reason: { type: string, maxLength: 512 }
        merchantRef: { type: string, maxLength: 256 }
        occurredAt: { type: string, format: date-time }
      description: Wallet command fact. amountMinor/currency come only from the issued WalletEntry snapshot.
    RemediationCommand:
      type: object
      additionalProperties: false
      required: [externalCommandId, action, awardItemNo, reason]
      properties:
        externalCommandId: { type: string, maxLength: 128 }
        action: { enum: [REISSUE, REVERSE, MANUAL_REVIEW] }
        awardItemNo: { type: string, maxLength: 64 }
        originalOperationNo: { type: string, maxLength: 64 }
        reason: { type: string, maxLength: 512 }
        approvalRef: { type: string, maxLength: 256 }
    RemediationResult:
      type: object
      additionalProperties: false
      required: [externalCommandId, remediationNo, status]
      properties:
        externalCommandId: { type: string }
        remediationNo: { type: string }
        status: { enum: [PROPOSED, APPROVED, DISPATCHING, SUCCEEDED, FAILED, UNKNOWN] }
        reference: { type: string }
        errorCode: { type: string }
    SkuTemplateChanged:
      type: object
      additionalProperties: false
      required: [skuId, version, benefitType, status, validityType, usableWeekdays]
      properties:
        skuId: { type: string, maxLength: 128 }
        version: { type: integer, format: int64, minimum: 0 }
        benefitType: { $ref: '#/components/schemas/BenefitType' }
        status: { enum: [DRAFT, PENDING_APPROVAL, ACTIVE, PAUSED, RETIRED] }
        faceValueMinor: { type: integer, format: int64 }
        currency: { type: string }
        validityType: { enum: [ABSOLUTE, RELATIVE] }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        relativeDays: { type: integer, minimum: 1 }
        usableWeekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        dailyQuota: { type: integer, format: int64, minimum: 1 }
        userLimitPerDay: { type: integer, format: int64, minimum: 1 }
        userLimitTotal: { type: integer, format: int64, minimum: 1 }
        equivalentSkuId: { type: string, maxLength: 128 }
    WorkflowEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, contractVersion, eventType, occurredAt, source, tenantId, correlationId, payload]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 128 }
        contractVersion: { const: 1 }
        eventType: { type: string, minLength: 1, maxLength: 64 }
        occurredAt: { type: string, format: date-time }
        source: { type: string, minLength: 1, maxLength: 64 }
        tenantId: { type: string, minLength: 1, maxLength: 64 }
        correlationId: { type: string, minLength: 1, maxLength: 256 }
        causationId: { type: string, maxLength: 128 }
        payload: { type: object }
    StartProcessCommandV1:
      type: object
      additionalProperties: false
      required: [processDefinitionKey, businessKey, idempotencyKey, initiator, variables]
      properties:
        processDefinitionKey: { const: benefitSkuGoLive }
        businessKey: { type: string, minLength: 1, maxLength: 128 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 256 }
        initiator: { type: string, minLength: 1, maxLength: 128 }
        variables:
          type: object
          additionalProperties: true
          description: Immutable, allowlisted SKU approval snapshot.
    WorkflowActor:
      type: object
      additionalProperties: false
      required: [subjectId, username]
      properties:
        subjectId: { type: string, minLength: 1, maxLength: 128 }
        username: { type: string, minLength: 1, maxLength: 128 }
        displayName: { type: string, maxLength: 256 }
    WorkflowActionRequestedV1:
      type: object
      additionalProperties: false
      required: [processInstanceId, taskId, taskDefinitionKey, processDefinitionKey, businessKey, actionId, action, actor, parameters]
      properties:
        processInstanceId: { type: string, minLength: 1, maxLength: 128 }
        taskId: { type: string, minLength: 1, maxLength: 128 }
        taskDefinitionKey: { const: skuGoLiveReview }
        processDefinitionKey: { const: benefitSkuGoLive }
        businessKey: { type: string, minLength: 1, maxLength: 128 }
        actionId: { type: string, minLength: 1, maxLength: 128 }
        action: { enum: [SKU_GO_LIVE_APPROVE, SKU_GO_LIVE_REJECT] }
        actor: { $ref: '#/components/schemas/WorkflowActor' }
        parameters: { type: object, additionalProperties: true }
    WorkflowActionAppliedV1:
      type: object
      additionalProperties: false
      required: [processInstanceId, processDefinitionKey, businessKey, actionId, status]
      properties:
        processInstanceId: { type: string, minLength: 1, maxLength: 128 }
        taskId: { type: string, maxLength: 128 }
        processDefinitionKey: { const: benefitSkuGoLive }
        businessKey: { type: string, minLength: 1, maxLength: 128 }
        actionId: { type: string, minLength: 1, maxLength: 128 }
        status: { enum: [APPLIED, REJECTED_BY_BUSINESS, FAILED_RETRYABLE, FAILED_FINAL] }
        businessVersion: { type: integer, format: int64, minimum: 0 }
        errorCode: { type: string, maxLength: 128 }
        errorMessage: { type: string, maxLength: 1024 }
    BenefitType:
      enum: [CASH, COUPON, SERVICE_VOUCHER, REDEMPTION_CODE, PHYSICAL]
