        quantity: { type: integer, format: int64, minimum: 1, maximum: 1 }
        metadata:
          type: object
          additionalProperties: { type: string, maxLength: 256 }
      description: Atomic item (quantity=1). Split multiple units into stable clientItemIds. CASH requires amountMinor/currency; every non-cash type forbids both monetary fields.
