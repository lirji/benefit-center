openapi: 3.0.3
info:
  title: Enterprise Benefit Center API
  version: 1.0.0
  description: |
    Company-wide idempotent benefit fulfillment API. Tenant identity is resolved from a verified JWT;
    callers cannot select a tenant or fulfillment channel in the body. V1 package policy is BEST_EFFORT.
servers:
  - url: https://benefit.example.internal
security:
  - bearerAuth: []
tags:
  - name: Awards
  - name: Wallet
  - name: Remediation
  - name: Internal catalog
  - name: Administration
  - name: Console
  - name: Channel callbacks
paths:
  /openapi/v1/award-orders:
    post:
      tags: [Awards]
      operationId: acceptAwardIntent
      summary: Idempotently accept an award intent
      description: Idempotency-Key must equal sourceRequestId in v1. A replay returns the original order.
      security:
        - bearerAuth: [benefit.award.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AwardIntent' }
      responses:
        '202':
          description: Accepted, including an idempotent replay
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Awards]
      operationId: findAwardOrderBySource
      summary: Recover an order by the producer idempotency identity
      security:
        - bearerAuth: [benefit.award.read]
      parameters:
        - in: query
          name: sourceSystem
          required: true
          schema: { type: string, maxLength: 64 }
        - in: query
          name: sourceRequestId
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AwardOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
  /openapi/v1/award-orders/{awardOrderNo}:
    get:
      tags: [Awards]
      operationId: getAwardOrder
      summary: Query an award order and its item-level outcomes
      security:
        - bearerAuth: [benefit.award.read]
      parameters:
        - in: path
          name: awardOrderNo
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AwardOrder' }
        '404': { $ref: '#/components/responses/NotFound' }
  /openapi/v1/wallet-entries/{entryId}:freeze:
    post:
      tags: [Wallet]
      operationId: freezeWalletEntry
      summary: Synchronously freeze an unused wallet entry with CAS
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/WalletEntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletEntryCommand' }
      responses:
        '202':
          description: State and version were committed, or the first result was replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletEntryCommandAcceptance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /openapi/v1/wallet-entries/{entryId}:redeem:
    post:
      tags: [Wallet]
      operationId: redeemWalletEntry
      summary: Synchronously redeem an unused or frozen wallet entry with CAS
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/WalletEntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletEntryCommand' }
      responses:
        '202':
          description: State, ledger, and fact were committed, or the first result was replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletEntryCommandAcceptance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /openapi/v1/wallet-entries/{entryId}:refund:
    post:
      tags: [Wallet]
      operationId: refundWalletEntry
      summary: Synchronously refund a used wallet entry with CAS
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/WalletEntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletEntryCommand' }
      responses:
        '202':
          description: State, ledger, and fact were committed, or the first result was replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletEntryCommandAcceptance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/catalog/skus:
    get:
      tags: [Internal catalog]
      operationId: listInternalBenefitSkus
      summary: List tenant-scoped benefit SKUs for trusted internal consumers
      description: |
        A configured machine subject authenticates the caller. X-Tenant-Id selects the upstream-verified
        business tenant only on this delegated endpoint; it is never derived from the login organization owner.
      security:
        - bearerAuth: [benefit.catalog.read]
      parameters:
        - $ref: '#/components/parameters/BusinessTenantId'
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/SkuTemplateStatus' }
        - in: query
          name: afterSkuId
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: SKU list limited to the asserted business tenant. An empty array means that tenant has no matching ACTIVE SKU.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkuView' }
        '401':
          description: Missing or invalid dedicated machine authentication.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: BENEFIT_TENANT_REQUIRED or BENEFIT_TENANT_MISMATCH for invalid delegation; otherwise the machine identity lacks benefit.catalog.read.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
  /internal/v1/remediations:
    post:
      tags: [Remediation]
      operationId: acceptRemediation
      summary: Propose an audited reissue, reversal, or manual review
      description: UNKNOWN original operations are rejected. Non-manual actions require approvalRef.
      security:
        - bearerAuth: [benefit.remediate]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemediationCommand' }
      responses:
        '200':
          description: Proposed or approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemediationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/remediations/{remediationNo}:
    get:
      tags: [Remediation]
      operationId: getRemediation
      security:
        - bearerAuth: [benefit.remediate]
      parameters:
        - $ref: '#/components/parameters/RemediationNo'
      responses:
        '200':
          description: Current remediation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemediationResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/remediations/{remediationNo}/execute:
    post:
      tags: [Remediation]
      operationId: executeRemediation
      security:
        - bearerAuth: [benefit.remediate]
      parameters:
        - $ref: '#/components/parameters/RemediationNo'
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: header
          name: X-Worker-Id
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Dispatch state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemediationResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/skus/{skuId}:
    put:
      tags: [Administration]
      operationId: upsertBenefitSku
      description: PENDING_APPROVAL templates are immutable. Clients cannot move DRAFT templates to PENDING_APPROVAL or ACTIVE.
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: skuId
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuCommand' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/skus/{skuId}:submit-for-approval:
    post:
      tags: [Administration]
      operationId: submitBenefitSkuForApproval
      description: Atomically moves a DRAFT template to PENDING_APPROVAL and enqueues workflow.command.start.v1.
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: skuId
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuSubmitCommand' }
      responses:
        '202':
          description: Approval submission accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuSubmitAcceptance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/skus/{skuId}:retry-approval:
    post:
      tags: [Administration]
      operationId: retryBenefitSkuApproval
      description: |
        Re-enqueues the current PENDING_APPROVAL workflow start with the original workflow idempotency key.
        The console should offer this only when approval-runtime confirms that no process instance exists or
        operations confirms that the start event entered DLQ. This does not bump the SKU version or open a new cycle.
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: skuId
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuRetryCommand' }
      responses:
        '202':
          description: Workflow start accepted for retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuSubmitAcceptance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/skus/{skuId}:withdraw-approval:
    post:
      tags: [Administration]
      operationId: withdrawBenefitSkuApproval
      description: |
        Moves a PENDING_APPROVAL SKU back to DRAFT using optimistic locking. It does not terminate or mutate any
        workflow instance; operators must inspect an existing instance in workflow-platform separately.
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: skuId
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuWithdrawCommand' }
      responses:
        '200':
          description: SKU returned to DRAFT; a replay of the same idempotency key returns the original response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuApprovalState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/v1/skus/{skuId}/approval-runtime:
    get:
      tags: [Administration]
      operationId: getBenefitSkuApprovalRuntime
      description: Read-only same-tenant workflow lookup used to distinguish a missing process from an active approval.
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - in: path
          name: skuId
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Current workflow definition and instance presence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuApprovalRuntime' }
        '503':
          description: Workflow runtime could not be queried; recovery actions must remain unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/v1/tenants/{tenantId}:
    put:
      tags: [Administration]
      operationId: upsertTenantPlacement
      description: The path tenant must equal the tenant mapped from the authenticated JWT audience.
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: tenantId
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCommand' }
      responses:
        '204': { description: Saved }
  /admin/v1/routes/{routeId}:
    put:
      tags: [Administration]
      operationId: upsertChannelRoute
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: routeId
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteCommand' }
      responses:
        '204': { description: Saved }
  /admin/v1/inventory/adjustments:
    post:
      tags: [Administration]
      operationId: adjustCenterInventory
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryCommand' }
      responses:
        '202': { description: Adjustment appended to the inventory ledger }
  /admin/v1/console/me:
    get:
      tags: [Console]
      operationId: getConsoleIdentity
      summary: Current console identity for the mapped JWT tenant
      security:
        - bearerAuth: [benefit.admin]
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleIdentity' }
  /admin/v1/console/overview:
    get:
      tags: [Console]
      operationId: getConsoleOverview
      summary: Tenant-scoped operational counts for the console dashboard
      security:
        - bearerAuth: [benefit.admin]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleOverview' }
  /admin/v1/console/attention-orders:
    get:
      tags: [Console]
      operationId: listAttentionOrders
      summary: Orders that are partial, remediating, or contain UNKNOWN/QUERYING items
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: Attention list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttentionOrder' }
  /admin/v1/tenants/current:
    get:
      tags: [Console]
      operationId: getCurrentTenant
      security:
        - bearerAuth: [benefit.admin]
      responses:
        '200':
          description: Current tenant config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantView' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/v1/skus:
    get:
      tags: [Console]
      operationId: listBenefitSkus
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/SkuTemplateStatus' }
        - in: query
          name: afterSkuId
          description: Seek cursor; return rows whose skuId is greater than this value.
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: SKU list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkuView' }
  /admin/v1/wallets/{subjectRef}:
    get:
      tags: [Console]
      operationId: getWallet
      summary: Get a tenant-scoped customer wallet summary
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/SubjectRef'
      responses:
        '200':
          description: Wallet summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletView' }
  /admin/v1/wallets/{subjectRef}/entries:
    get:
      tags: [Console]
      operationId: listWalletEntries
      summary: List wallet entries with seek pagination
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/SubjectRef'
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/WalletEntryStatus' }
        - in: query
          name: skuId
          schema: { type: string, maxLength: 128 }
        - in: query
          name: afterEntryId
          description: Seek cursor; return rows whose entryId is greater than this value.
          schema: { type: string, maxLength: 64 }
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: Wallet entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WalletEntryView' }
  /admin/v1/routes:
    get:
      tags: [Console]
      operationId: listChannelRoutes
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - in: query
          name: skuId
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: Route list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouteView' }
  /admin/v1/inventory/accounts:
    get:
      tags: [Console]
      operationId: listInventoryAccounts
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: Inventory balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryView' }
  /admin/v1/remediations:
    get:
      tags: [Console]
      operationId: listRemediations
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: Remediation list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemediationView' }
  /admin/v1/code-assets:
    get:
      tags: [Console]
      operationId: listCodeAssets
      description: Returns metadata only. cipherText is never included; codeHash is truncated to 8 characters.
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - in: query
          name: skuId
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200':
          description: Code asset metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CodeAssetView' }
    post:
      tags: [Administration]
      operationId: importEncryptedCodeAsset
      security:
        - bearerAuth: [benefit.admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeAssetCommand' }
      responses:
        '202': { description: Imported; plaintext codes are not accepted by this contract }
  /callbacks/v1/channels/{channelCode}:
    post:
      tags: [Channel callbacks]
      operationId: receiveChannelCallback
      summary: Receive a signed, replay-protected channel callback
      security: []
      parameters:
        - in: path
          name: channelCode
          required: true
          schema: { type: string, maxLength: 64 }
        - in: header
          name: X-Callback-Timestamp
          required: true
          schema: { type: string }
        - in: header
          name: X-Callback-Nonce
          required: true
          schema: { type: string, maxLength: 128 }
        - in: header
          name: X-Callback-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: Callback accepted or replayed }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.internal/oauth/token
          scopes:
            benefit.award.write: Submit award intents
            benefit.award.read: Query award state
            benefit.catalog.read: Read the tenant-scoped benefit catalog
            benefit.remediate: Submit and query remediation
            benefit.admin: Manage catalog and owned inventory
  parameters:
    BusinessTenantId:
      in: header
      name: X-Tenant-Id
      required: true
      description: Business tenant already verified by the trusted upstream service.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    RemediationNo:
      in: path
      name: remediationNo
      required: true
      schema: { type: string, maxLength: 64 }
    WalletEntryId:
      in: path
      name: entryId
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ConsoleLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    SubjectRef:
      in: path
      name: subjectRef
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    BadRequest:
      description: Invalid intent or command
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid authentication
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Missing scope, invalid tenant mapping, or cross-tenant envelope
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Idempotency payload conflict or invalid state transition
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found in the authenticated tenant
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    AwardIntent:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceSystem, sourceRequestId, recipientRef, partialPolicy, items]
      properties:
        schemaVersion: { type: string, enum: ['1.0'] }
        sourceSystem: { type: string, minLength: 1, maxLength: 64 }
        sourceRequestId: { type: string, minLength: 1, maxLength: 128 }
        sourceBusinessNo: { type: string, maxLength: 128, nullable: true }
        recipientRef: { type: string, minLength: 1, maxLength: 256 }
        decision: { $ref: '#/components/schemas/DecisionReference' }
        partialPolicy: { type: string, enum: [BEST_EFFORT] }
