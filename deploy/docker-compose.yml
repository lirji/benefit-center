services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: benefit_center
      MYSQL_USER: benefit
      MYSQL_PASSWORD: benefit-dev
      MYSQL_ROOT_PASSWORD: root-dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports: ["3308:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-dev --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - benefit_mysql:/var/lib/mysql

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092"]
    ports: ["19092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  benefit-center:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BENEFIT_DB_URL: jdbc:mysql://mysql:3306/benefit_center?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      BENEFIT_DB_USER: benefit
      BENEFIT_DB_PASSWORD: benefit-dev
      BENEFIT_KAFKA_BOOTSTRAP: redpanda:9092
      BENEFIT_SECURITY_DEV_MODE: "true"
      BENEFIT_WORKER_ENABLED: "true"
      BENEFIT_WORKER_TENANTS: dev-tenant
      BENEFIT_OUTBOX_ENABLED: "true"
      BENEFIT_AWARD_INTENT_CONSUMER_ENABLED: "true"
      BENEFIT_REMEDIATION_CONSUMER_ENABLED: "true"
    ports: ["8083:8083"]
    depends_on:
      mysql: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  benefit_mysql: {}
