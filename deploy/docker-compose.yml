services:
  benefit-center:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      BENEFIT_DB_URL: jdbc:mysql://infra-mysql84:3306/benefit_center?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      BENEFIT_DB_USER: ${BENEFIT_DB_USER:-benefit}
      BENEFIT_DB_PASSWORD: ${BENEFIT_DB_PASSWORD:?set BENEFIT_DB_PASSWORD in deploy/.env}
      BENEFIT_KAFKA_BOOTSTRAP: infra-kafka38:9092
      BENEFIT_REDIS_HOST: infra-redis7
      BENEFIT_REDIS_PORT: 6379
      BENEFIT_REDIS_PASSWORD: ${BENEFIT_REDIS_PASSWORD:?set BENEFIT_REDIS_PASSWORD in deploy/.env}
      BENEFIT_SECURITY_DEV_MODE: "true"
      BENEFIT_WORKER_ENABLED: "true"
      BENEFIT_WORKER_TENANTS: dev-tenant
      BENEFIT_OUTBOX_ENABLED: "true"
      BENEFIT_AWARD_INTENT_CONSUMER_ENABLED: "true"
      BENEFIT_REMEDIATION_CONSUMER_ENABLED: "true"
      # SKU 上线审批 Kafka 闭环；默认关闭，仅由本机/目标环境显式开启。
      WORKFLOW_KAFKA_ENABLED: ${WORKFLOW_KAFKA_ENABLED:-false}
      WORKFLOW_KAFKA_SOURCE_SIGNING_KEYS: ${WORKFLOW_KAFKA_SOURCE_SIGNING_KEYS:-}
      # 仅用于控制台判断审批实例是否已建立；流程台开启 OAuth2 时再显式提供机器 token。
      WORKFLOW_HTTP_BASE_URL: ${WORKFLOW_HTTP_BASE_URL:-http://workflow-server:8300}
      WORKFLOW_HTTP_BEARER_TOKEN: ${WORKFLOW_HTTP_BEARER_TOKEN:-}
    ports: ["127.0.0.1:8183:8083"]
    networks:
      - dev-infra
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30

  console:
    build:
      context: ../benefit-console
      dockerfile: Dockerfile
      args:
        VITE_WORKFLOW_CONSOLE_ORIGIN: ${VITE_WORKFLOW_CONSOLE_ORIGIN:-}
    restart: unless-stopped
    environment:
      BENEFIT_API_URL: http://benefit-center:8083
    ports: ["${BENEFIT_UI_PORT:-8083}:8083"]
    depends_on:
      benefit-center:
        condition: service_healthy
    networks:
      - dev-infra
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  dev-infra:
    external: true
    name: ${DEV_INFRA_NETWORK:-dev-infra}
