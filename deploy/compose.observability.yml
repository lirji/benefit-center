# 与 docker-compose.yml（及可选 compose.secure.yml）叠加，接入共享 OTel/Tempo/Grafana。
services:
  benefit-center:
    environment:
      JAVA_TOOL_OPTIONS: ${BENEFIT_JAVA_TOOL_OPTIONS:--javaagent:/otel/opentelemetry-javaagent.jar}
      OTEL_SERVICE_NAME: benefit-center
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://infra-otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=platforms,deployment.environment.name=local
    volumes:
      - otel-java-agent:/otel:ro

volumes:
  otel-java-agent:
    external: true
    name: dev-infra-otel-java-agent
